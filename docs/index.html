<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>코어 러시</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=VT323&display=swap">
<style>
/* Layout: RTS frame — status bar on top, playfield in the middle, command console at the bottom; title art letterboxed with hotspots over its painted buttons */
:root{
  --void:#060912; --panel:#0c1322; --panel-2:#121d33; --edge:#22345a; --edge-hi:#3a5a92;
  --glow:#46b8ff; --amber:#ffa62b; --text:#e6edfb; --dim:#8394b6; --good:#58e08a; --bad:#ff4d6a;
  --f-head:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-ui:"IBM Plex Sans KR",system-ui,sans-serif;
  --f-num:"VT323",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--text);font:14px var(--f-ui);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto}
.frame{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge);box-shadow:inset 0 1px 0 #ffffff12;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;line-height:1}
.hp{height:8px;background:#02040a;border:1px solid var(--edge);overflow:hidden}
.hp i{display:block;height:100%;background:var(--good);transition:width .2s}
.hp.sm{height:5px}

#top{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#0e182c,#080d18);border-bottom:1px solid var(--edge)}
#top::after,#cmd::before{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.45}
#top::after{bottom:-1px}
#cmd::before{top:-1px}
.res{display:flex;gap:8px;flex-wrap:wrap}
.rescell{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 10px;min-width:100px}
.storecell{position:relative;cursor:pointer;clip-path:none!important}
.storepop{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:#0b1322;padding:10px 12px;min-width:200px;grid-template-columns:1fr;gap:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.storepop span{display:flex;align-items:center;gap:6px;font:14px var(--f-body,sans-serif);white-space:nowrap}
.storepop b{margin-left:auto;padding-left:14px;font-size:16px}
.storepop em{font:normal 12px var(--f-head);color:var(--glow);margin-top:4px}
.storepop em:first-child{margin-top:0}
.qty{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trow{padding:12px 16px;display:grid;gap:8px}
.ttop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ttop h4{margin:0;display:flex;align-items:center;gap:8px;font:400 20px var(--f-head);white-space:nowrap}
.thave{margin-left:auto;display:flex;align-items:baseline;gap:5px;color:var(--dim);font:15px var(--f-head)}
.thave b{font-size:28px;color:var(--text)}
.tsub{color:var(--dim);font-size:13px}
.tsub{display:flex;align-items:baseline;gap:6px;font:15px var(--f-head)}
.tsub b{color:var(--amber);font-size:26px}
.schips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.schip{display:inline-grid;grid-template-columns:auto auto;align-items:baseline;column-gap:6px;padding:4px 10px;background:#0c1427;border:1px solid var(--edge);cursor:help}
.schip small{font:12px var(--f-head);color:var(--dim)}
.schip b{font:600 19px var(--f-num)}
.schip.g b{color:#58e08a} .schip.b b{color:#ff6b7f} .schip.z b{color:var(--dim)}
.schip i{grid-column:1/-1;font:normal 11px var(--f-num);text-align:right}
.schip i.up{color:#58e08a} .schip i.dn{color:#ff6b7f}
.wline{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px;color:var(--dim);padding:5px 10px;background:#140f0a;border-left:3px solid var(--amber);margin:4px 0;cursor:help}
.wline .wk{font:15px var(--f-head);color:var(--text)}
.wline b{color:var(--text);font-family:var(--f-num)}
.ftags{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.ftag{font:12px var(--f-head);padding:2px 8px;border:1px solid #5a4a8a;background:#1a1530;color:#d7c8ff;cursor:help}
.pdesc{font-size:12px!important;color:var(--dim)!important;margin:4px 0 0!important}
#tip{position:fixed;z-index:200;max-width:280px;padding:8px 11px;background:#060b16f2;border:1px solid var(--glow);color:var(--text);font-size:13px;line-height:1.45;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.rvbox{position:static!important;padding:0!important;min-width:0!important;display:grid;place-items:center;height:116px;margin-bottom:4px}
.qdead{color:var(--dim)}
.opscard.hard{border-color:#ff4d6a!important;background:linear-gradient(180deg,#2a0d14,#140810)!important}
.opscard.hard .launch{background:linear-gradient(180deg,#ff6b7f,#c23a4a)!important}
.diffsel{display:flex;gap:4px} .hardb.on{border-color:#ff4d6a!important;color:#ffb3bd!important;background:#3a1018!important}
.hardnote b{color:#ff8a9a}
.dimrow{opacity:.6}
#detClose{display:none;margin-left:6px;align-self:flex-start}
@media (orientation:landscape) and (max-height:500px){
  .craftgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)!important;gap:10px}
  .cright{border-left:1px solid var(--edge)!important;padding-left:10px!important}
  #bMain.fixed{display:flex!important;overflow:hidden!important}
  .craftwrap{grid-template-columns:minmax(0,1fr) 110px!important;gap:8px;margin-top:4px}
  .doll{gap:4px} .pslot{min-height:46px!important} .pslot span{display:none} .pslot b{font-size:12px!important}
  .coreslots .pslot{min-height:38px!important}
  #craftCv{max-height:110px} .cst{font-size:10px;gap:1px 4px}
  .selact{padding:4px 8px;margin:4px 0} .selname b{font-size:14px} .selbtns .act{padding:4px 8px;font-size:13px}
  #bPanel .bmain{padding:8px 10px}
  .ptab{font-size:13px} #ptip{font-size:13px;width:min(340px,calc(100vw - 16px))}
}
#ptip{position:fixed;z-index:210;width:min(460px,calc(100vw - 16px));padding:14px 16px;background:#060b16f5;border:1px solid var(--glow);box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;font-size:16px;display:grid;gap:6px}
#ptip .pt-t{font:15px var(--f-head);color:var(--glow)}
#ptip .pt-h{display:flex;align-items:center;gap:8px;font:400 24px var(--f-head)}
#ptip .pt-vs{font:12px var(--f-head);color:var(--dim);text-align:center}
.ptab{width:100%;border-collapse:collapse;font-size:16px}
#ptip .schip b{font-size:20px} #ptip .wline{font-size:14px} #ptip .pdesc{font-size:13px!important}
.ptab th{font:13px var(--f-head);color:var(--dim);text-align:right;padding:2px 6px;vertical-align:bottom}
.ptab th span{color:var(--text);font-size:15px}
.ptab td{padding:3px 6px;text-align:right;font-family:var(--f-num);border-top:1px solid #1d2840}
.ptab td:first-child{text-align:left;font-family:var(--f-head);color:var(--dim)}
.ptab td.up{color:#58e08a} .ptab td.dn{color:#ff6b7f} .ptab td.chg{color:var(--amber)}
.selact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:6px 0 8px}
.selname{display:grid;min-width:0;flex:1}
.selname small{font:12px var(--f-head);color:var(--dim)} .selname b{font:400 17px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.paintpop{padding:8px 12px;margin-top:6px}
.paintpop .paint:first-child{margin-top:0}
.pslot{min-height:clamp(52px,7.4vh,100px)!important;padding:3px!important;gap:0!important}
.coreslots .pslot{min-height:clamp(40px,4.8vh,70px)!important}
.coreslots{margin-top:6px!important;gap:6px!important}
#craftCv{max-height:26vh;width:auto!important;max-width:100%;margin:0 auto}
.bcard{padding:14px 16px;display:grid;gap:6px;margin-bottom:12px}
.bcard .row b{font-weight:400;text-align:right}
#decoBar{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 12px;max-width:calc(100% - 24px);background:#0b1322f2}
#decoBar .dchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#0c1427;border:1px solid var(--edge);color:var(--text);font:14px var(--f-head);cursor:pointer}
#decoBar .dchip.on{border-color:var(--amber);background:#2a1d08}
#decoBar b{font:16px var(--f-head);color:var(--amber);margin-right:6px}
.prep{padding:24px 28px;width:min(620px,100%);display:grid;gap:10px}
.prep h3{font:400 26px var(--f-head);margin:0}
.prep p{margin:0;font-size:13px}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:10px 12px;background:#0c1427;border:1px solid var(--edge);font:17px var(--f-head)}
.prow.lead2{grid-template-columns:1fr auto}
.prow.tot{background:none;border:0;border-top:1px solid var(--edge);grid-template-columns:auto auto 1fr}
.prow.tot b{font-size:24px}
.prow.tot span:last-child{text-align:right;font-size:13px}
.inschk{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:#0b1322;border:1px solid var(--edge);color:var(--dim);font:15px var(--f-head);cursor:pointer}
.inschk i{width:18px;height:18px;border:1px solid var(--edge-hi);display:grid;place-items:center;font-style:normal;color:#06101e}
.inschk.on{color:var(--text);border-color:var(--amber)} .inschk.on i{background:var(--amber);border-color:var(--amber)}
.pbtns2{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.pbtns2 .main{min-width:140px;font-size:18px}
.setinfo{font-size:12px;color:var(--dim);padding:6px 4px 2px;border-top:1px solid var(--edge);margin-top:4px} .qdead.last{color:#ff6b7f}
.qty input{width:64px;padding:5px 6px;background:#0c1427;border:1px solid var(--edge);color:var(--text);font:15px var(--f-num);text-align:center}
.qty input::-webkit-inner-spin-button{opacity:.5}
.qty .act{margin-left:auto;min-width:170px}
.qty .mini{min-width:36px;padding:6px 10px}
.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.matcell{display:flex;align-items:center;gap:10px;padding:10px 12px}
.matcell b{margin-left:auto;font-size:20px}
.matcell.zero{opacity:.45}
.matcell small{display:block;color:var(--dim);font-size:11px}
.storecell:hover .storepop,.storecell.open .storepop{display:grid}
.orebar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;margin:8px 0 12px;align-items:center}
.orechip{display:inline-flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap}
.orechip b{font-size:16px}
.orechip.cr b{color:var(--amber)}
.pbuyw{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.act .short{color:#ff6b7f}
.shortln{color:#ff6b7f;font-size:12px}
.gem{width:11px;height:11px;transform:rotate(45deg);flex:none}
.rescell .k{font:15px var(--f-head);color:var(--dim)}
.rescell .n{font-size:24px;margin-left:auto}
.wave{min-width:240px;text-align:center;padding:5px 20px 7px;display:grid;gap:2px}
.wave .lbl{font:15px var(--f-head);color:var(--dim);letter-spacing:.04em}
.wave .num{font-size:32px}
.tbar{height:3px;background:#02040a}
.tbar i{display:block;height:100%;background:var(--glow)}
.wave.warn{border-color:var(--bad)} .wave.warn .num{color:var(--bad)} .wave.warn .tbar i{background:var(--bad)}
.wave.lift .num{color:var(--glow)}
.shipbox{justify-self:end;display:grid;grid-template-columns:auto 180px auto;align-items:center;gap:10px;padding:7px 14px}
.shipbox .k{font:15px var(--f-head);color:var(--dim)}
.shipbox .num{font-size:24px;min-width:40px;text-align:right}

#stage{position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);font:17px var(--f-head);padding:8px 20px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#toast.bad{border-color:var(--bad);color:#ff9aa9}

#mid{display:grid;grid-template-columns:210px minmax(0,1fr) 60px;min-height:0}
#side{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0;padding:10px 8px 10px max(10px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,#0a1222,#070c17);border-right:1px solid var(--edge)}
.roster{display:grid;align-content:start;gap:6px;overflow-y:auto;min-height:0}
.urow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;background:linear-gradient(90deg,#14213c,#0c1427);border:1px solid var(--edge);color:inherit;font:inherit;text-align:left;cursor:pointer}
.urow:hover{border-color:var(--edge-hi)}
.urow.sel{border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow),inset 0 0 14px #46b8ff30}
.urow.dead{opacity:.4}
.ubadge{width:34px;height:34px;display:grid;place-items:center;font:20px var(--f-num);color:#14203a;background:#e3e7ef;border-bottom:3px solid #f29a2e}
.ubadge.lead{background:#f29a2e;color:#1b1205;border-bottom-color:#8a5a17}
.uinfo{display:grid;gap:3px;min-width:0}
.unm{font:15px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upip{font:16px var(--f-num);color:var(--dim)}
.detail{padding:10px;display:grid;gap:6px;max-height:48vh;overflow-y:auto}
.dhead{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center}
.dhead h3{font:400 19px var(--f-head);margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portrait{display:block;width:56px;height:56px;background:radial-gradient(circle at 50% 40%,#1a2d54,#080d1a);border:1px solid var(--edge-hi)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);line-height:1.6}
.row b{color:var(--text);font-weight:600;text-align:right}
.cg-row{display:flex;align-items:center;gap:6px;font-size:12px}
.cg-row span{margin-right:auto}
#mini{position:relative;border-left:1px solid var(--edge);background:#05080f}
#mm{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
#cmd{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#0b1324,#060a14);border-top:1px solid var(--edge)}
.hint{font-size:12px;color:var(--dim);margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cmdbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 9px;font:16px var(--f-head);color:var(--text);background:linear-gradient(180deg,#17243f,#0c1427);border:1px solid var(--edge);cursor:pointer;white-space:nowrap}
.cmdbtn small{font:11px var(--f-ui);color:var(--dim)}
.cmdbtn .hk{font:15px var(--f-num);color:var(--amber)}
.cmdbtn:hover:not(:disabled){border-color:var(--glow);box-shadow:inset 0 0 14px #46b8ff38}
.cmdbtn:focus-visible,.urow:focus-visible,.hot:focus-visible,.cardbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.cmdbtn.on{border-color:var(--amber);background:linear-gradient(180deg,#43300f,#1d1508)}
.cmdbtn:disabled{opacity:.35;cursor:not-allowed}
.cmdbtn.lift{border-color:#2f6aa8;background:linear-gradient(180deg,#14335a,#0b1a30)}
.pop{position:absolute;z-index:5;padding:12px;min-width:250px;max-width:calc(100% - 20px);display:grid;gap:6px}
#storePop{top:10px;left:10px}
#buildPop{bottom:10px;right:10px}
.pop h4{margin:0 0 4px;font:400 18px var(--f-head)}
.poprow{display:flex;align-items:center;gap:8px;font-size:13px}
.poprow span{margin-right:auto}
.ttbtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:8px 10px;font:inherit;color:var(--text);background:linear-gradient(180deg,#17243f,#0c1427);border:1px solid var(--edge);cursor:pointer}
.ttbtn b{font:400 17px var(--f-head)}
.ttbtn small{color:var(--dim);font-size:11px;grid-column:1/-1}
.ttbtn:hover:not(:disabled){border-color:var(--glow)}
.ttbtn:disabled{opacity:.4;cursor:not-allowed}
.chipbtn{cursor:pointer;font:inherit;color:inherit}
.chipbtn:hover{border-color:var(--glow)}

#menu{position:absolute;inset:0;z-index:20;background:#03050b;display:grid;place-items:center}
.title{position:relative;width:min(100vw,177.7vh);aspect-ratio:1672/941;max-width:100%}
.title img{display:block;width:100%;height:100%}
.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;transition:background .15s,box-shadow .15s}
.hot:hover{background:#46b8ff1c;box-shadow:0 0 0 2px #46b8ffb0,0 0 26px #46b8ff70}
#dexOv{position:absolute;inset:4%;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr);background:#0b1322;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#dexOv .bmain{background:none}
@media (min-width:1400px) and (min-height:700px){#dexOv .bmain,#dexOv .phead{zoom:1.25}}
@media (min-width:1800px) and (min-height:880px){#dexOv .bmain,#dexOv .phead{zoom:1.4}}
#menuMsg{position:absolute;left:6.3%;top:79%;font:clamp(14px,1.4vw,20px) var(--f-head);text-shadow:0 1px 4px #000,0 0 2px #000}

#ov{position:absolute;inset:0;z-index:15;display:grid;place-items:center;background:#03050bc4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:480px;padding:26px 28px 24px}
.card h1{font:400 36px/1.1 var(--f-head);margin:0 0 6px;color:var(--amber);text-wrap:balance}
.card .sub{color:var(--dim);margin:0 0 16px}
.card ul{margin:0 0 20px;padding-left:18px;font-size:13px;line-height:1.75}
.card kbd{font:16px var(--f-num);color:var(--amber);background:#0a1020;border:1px solid var(--edge);padding:0 5px}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0 0 20px;font-size:14px}
.stats span:nth-child(even){font:22px var(--f-num);text-align:right}
.btns{display:flex;gap:8px}
.cardbtn{flex:1;font:18px var(--f-head);padding:11px;color:var(--text);background:linear-gradient(180deg,#17243f,#0c1427);border:1px solid var(--edge);cursor:pointer}
.cardbtn.main{background:linear-gradient(180deg,#ffb544,#e8871a);color:#1b1205;border-color:#ffc56a}
.cardbtn:hover{filter:brightness(1.1)}
#base{position:absolute;inset:0;z-index:18;display:grid;grid-template-rows:auto minmax(0,1fr);background:#05080f;isolation:isolate}
#base::before{content:"";position:absolute;inset:0;background:url(title.jpg) center/cover;filter:blur(6px) brightness(.3) saturate(1.1);transform:scale(1.05);z-index:-1}
.bhead{position:relative;z-index:6;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--edge);background:#070c18e0}
.brand{font:28px var(--f-head);color:var(--amber)}
.brand span{font-size:16px;color:var(--dim);margin-left:8px}
.bres{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
