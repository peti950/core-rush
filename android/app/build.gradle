plugins { id 'com.android.application' }
android {
    namespace 'com.peti5.corerush'
    compileSdk 34
    defaultConfig {
        applicationId 'com.peti5.corerush'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug   // 테스트용 서명 (플레이스토어 업로드 시 정식 서명으로 교체)
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
