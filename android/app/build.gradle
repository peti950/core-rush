plugins { id 'com.android.application' }
def buildNo = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
android {
    namespace 'com.peti5.corerush'
    compileSdk 34
    defaultConfig {
        applicationId 'com.peti5.corerush'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(buildNo)
        versionName '1.0.' + buildNo
    }
    signingConfigs {
        game {   // 테스트용 고정 서명 키 (앱 업데이트 시 같은 키로 덮어 설치되도록)
            storeFile file('../corerush.keystore')
            storePassword 'corerush123'
            keyAlias 'corerush'
            keyPassword 'corerush123'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.game
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'html' }
}
