name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy game files into the app
        run: cp -r docs/. android/app/src/main/assets/
      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Save build log
        if: failure()
        run: |
          tail -80 build.log > build-error.txt || true
          echo "::error title=build::$(grep -m3 -E 'What went wrong|error:|Exception' build.log | tr '\n' ' ' | cut -c1-900)"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CoreRush.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoreRush-apk
          path: CoreRush.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 코어 러시 빌드 ${{ github.run_number }}
          body: 휴대폰에서 아래 CoreRush.apk 를 눌러 내려받고 설치하세요.
          files: CoreRush.apk
          make_latest: true

